apiVersion: apps/v1
kind: Deployment
metadata:
  name: rata-live-chat
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rata-live-chat
  template:
    metadata:
      labels:
        app: rata-live-chat
    spec:
      imagePullSecrets:
        - name: regcred
      containers:
        - name: rata-live-chat
          image: registry.rata.id/rata-live-chat-ui:placeholder
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            timeoutSeconds: 2
            periodSeconds: 5
            successThreshold: 1
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            timeoutSeconds: 3
            periodSeconds: 10
            failureThreshold: 3
